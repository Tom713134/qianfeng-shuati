name: Release zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack portable folder
        run: |
          mkdir qianfeng-shuati
          cp index.html app.js styles.css server.ps1 \
            start.bat open.vbs app.ico how-to.html LICENSE README.md qianfeng-shuati/
          cp -r questions qianfeng-shuati/questions
          cp -r sponsor qianfeng-shuati/sponsor
          zip -r qianfeng-shuati-windows.zip qianfeng-shuati
      - uses: softprops/action-gh-release@v2
        with:
          files: qianfeng-shuati-windows.zip
          generate_release_notes: true
